name: Secure-Cloud CI/CD
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy tested images to the Ubuntu storage server (main only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: secure_cloud_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d secure_cloud_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/secure_cloud_test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/secure_cloud_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate --workspace backend
      - run: npm run prisma:deploy --workspace backend
      - run: npm run typecheck
      - run: npm run lint --workspace backend
      - run: npm test
      - run: npm run build
      - name: Validate monitoring configuration
        run: bash monitoring/scripts/validate.sh

  images:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.publish.outputs.backend }}
      frontend: ${{ steps.publish.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: secure-cloud-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          tags: secure-cloud-frontend:ci
          build-args: NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || '/api' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Test real containers with disposable services and storage
        run: bash scripts/smoke-containers.sh
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested images and record immutable digests
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          repository="${REPOSITORY,,}"
          for service in backend frontend; do
            image="ghcr.io/$repository-$service:$COMMIT"
            docker tag "secure-cloud-$service:ci" "$image"
            docker push "$image"
            digest=$(docker inspect --format '{{json .RepoDigests}}' "$image" | jq -r --arg prefix "ghcr.io/$repository-$service@" '.[] | select(startswith($prefix))' | head -n 1)
            test -n "$digest"
            echo "$service=$digest" >> "$GITHUB_OUTPUT"
          done

  deploy:
    needs: images
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy
    runs-on: [self-hosted, Linux, X64, secure-cloud]
    environment: production
    timeout-minutes: 15
    concurrency:
      group: secure-cloud-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy exact tested images
        env:
          BACKEND_IMAGE: ${{ needs.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ needs.images.outputs.frontend }}
          APP_ENV_FILE: /etc/secure-cloud/backend.env
          MONITORING_RUNTIME_DIR: /etc/secure-cloud/monitoring
          APP_UID: ${{ vars.APP_UID || '1000' }}
          APP_GID: ${{ vars.APP_GID || '1000' }}
        run: |
          set -euo pipefail
          test -r "$APP_ENV_FILE"
          test -r "$MONITORING_RUNTIME_DIR/postgres.env"
          test -r "$MONITORING_RUNTIME_DIR/postgres-exporter.env"
          test -r "$MONITORING_RUNTIME_DIR/grafana_admin_password"
          test -d /srv/secure-cloud-storage
          docker compose config --quiet
          docker compose pull
          # Stop writers before applying potentially incompatible migrations.
          docker compose stop nginx frontend backend
          docker compose run --rm --no-deps migrate
          docker compose up -d --no-build --wait --wait-timeout 180
          echo "Deployed backend: $BACKEND_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed frontend: $FRONTEND_IMAGE" >> "$GITHUB_STEP_SUMMARY"
