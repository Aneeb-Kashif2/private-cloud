name: Security

# Shift-left security. Four independent checks, all of them free on private
# repositories (no GitHub Advanced Security licence required):
#
#   1. secret scan       - did anyone commit a credential?
#   2. dependency audit  - do the npm dependencies have known advisories?
#   3. filesystem scan   - vulnerable dependencies, embedded secrets, misconfiguration
#   4. image scan        - CVEs in the actual shipped containers (this one gates)
#
# It also runs weekly so a newly published CVE is caught without a code change.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret that was committed and deleted is still leaked.
          fetch-depth: 0
          persist-credentials: false
      - name: Scan git history with Gitleaks
        # Pinned by release, not by a floating tag. Gitleaks is not covered by the
        # Dependabot configuration, so bump this deliberately when a release ships.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --verbose --exit-code 1 --no-banner

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: npm audit (informational)
        # Advisory-only on purpose. The advisory database changes daily, and a red main
        # branch caused by an upstream transitive dependency helps nobody. Dependabot
        # opens the fixing pull request; the image scan below is the real gate.
        run: npm audit --audit-level=high
        continue-on-error: true

  filesystem:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Scan sources for vulnerabilities, secrets and misconfiguration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          # Informational: a lockfile-only finding should be visible, not blocking.
          # Trivy reads .trivyignore from the scan root automatically.
          exit-code: '0'

  images:
    name: Container image scan (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: secure-cloud-backend:scan
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          tags: secure-cloud-frontend:scan
          build-args: NEXT_PUBLIC_API_URL=/api
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Fail on CRITICAL CVEs in the backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: secure-cloud-backend:scan
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
      - name: Fail on CRITICAL CVEs in the frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: secure-cloud-frontend:scan
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
      - name: Write the software bill of materials
        # A CycloneDX SBOM is the artefact a security team actually asks for when a new
        # CVE lands: it answers "are we affected?" without rebuilding anything.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: secure-cloud-backend:scan
          format: cyclonedx
          output: backend.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-backend
          path: backend.cdx.json
          retention-days: 30
