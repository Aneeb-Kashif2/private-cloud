# Privacy-safe access logs: categorical routes only, never request/query/header values.
map $uri $log_route {
    default "frontend";
    ~^/api/files/[^/]+/download$ "download";
    /api/files/upload "upload";
    ~^/api/auth/ "auth";
    ~^/api/ "api";
    ~^/grafana "grafana";
    /health "health";
}
map $request_method $log_method {
    default "OTHER";
    GET GET; POST POST; PUT PUT; PATCH PATCH; DELETE DELETE; HEAD HEAD; OPTIONS OPTIONS;
}
log_format safe_json escape=json '{"event":"http_request","method":"$log_method","route":"$log_route","status":$status,"duration_seconds":$request_time,"bytes_sent":$bytes_sent}';
access_log /dev/stdout safe_json;
# Nginx error messages may contain a raw request URI; collect structured access errors instead.
error_log /dev/stderr crit;
server {
    listen 127.0.0.1:8082;
    server_name localhost;
    access_log off;
    location = /stub_status { stub_status; }
    location / { return 404; }
}
# Mounted into /etc/nginx/conf.d/default.conf (inside nginx's http context).
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
# Cloudflare terminates browser TLS; retain its original scheme when supplied.
map $http_x_forwarded_proto $secure_cloud_scheme {
    default $scheme;
    https https;
    http http;
}
server {
    listen 8080 default_server;
    access_log /dev/stdout safe_json;
    error_log /dev/stderr crit;
    server_name _;
    server_tokens off;
    client_max_body_size 5g;
    client_body_timeout 3600s;
    send_timeout 3600s;

    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location = /metrics { return 404; }
    location = /grafana { return 302 /grafana/; }
    location /grafana/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $secure_cloud_scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location = /health {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $secure_cloud_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://127.0.0.1:4000/health;
        proxy_set_header Connection "";
    }
    # Keep the /api prefix when forwarding to Fastify.
    location /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $secure_cloud_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "private, no-store" always;
    }
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $secure_cloud_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
}
