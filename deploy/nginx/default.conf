# Mounted into /etc/nginx/conf.d/default.conf (inside nginx's http context).
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
# Cloudflare terminates browser TLS; retain its original scheme when supplied.
map $http_x_forwarded_proto $secure_cloud_scheme {
    default $scheme;
    https https;
    http http;
}
server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 5g;
    client_body_timeout 3600s;
    send_timeout 3600s;

    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location = /health {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $secure_cloud_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://127.0.0.1:4000/health;
        proxy_set_header Connection "";
    }
    # Keep the /api prefix when forwarding to Fastify.
    location /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $secure_cloud_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "private, no-store" always;
    }
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $secure_cloud_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
}
