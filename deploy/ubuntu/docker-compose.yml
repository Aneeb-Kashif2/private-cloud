name: secure-cloud-ubuntu

x-app: &app
  network_mode: host
  restart: unless-stopped
  user: "${APP_UID:-1000}:${APP_GID:-1000}"
  env_file: ${APP_ENV_FILE:-./backend.env}
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  init: true

services:
  postgres:
    image: postgres:17-alpine
    env_file: ${POSTGRES_ENV_FILE:-./postgres.env}
    ports: [127.0.0.1:5432:5432]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: [postgres, -c, log_statement=none, -c, log_min_error_statement=panic, -c, log_error_verbosity=terse]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports: [127.0.0.1:6379:6379]
    volumes:
      - redis_data:/data
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    image: ${BACKEND_IMAGE:-secure-cloud-backend:local}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    environment: {NODE_ENV: production}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: ["../node_modules/.bin/prisma", migrate, deploy]
    restart: "no"

  backend:
    <<: *app
    image: ${BACKEND_IMAGE:-secure-cloud-backend:local}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "4000"
      STORAGE_PATH: /srv/secure-cloud-storage
      STORAGE_LIMIT_BYTES: "5368709120"
    volumes:
      - type: bind
        source: /srv/secure-cloud-storage
        target: /srv/secure-cloud-storage
        bind: {create_host_path: false}
    depends_on:
      migrate: {condition: service_completed_successfully}
    stop_grace_period: 5m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:stable-alpine
    network_mode: host
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_VOLUME_NAME:-self-cloud-prj_postgres_data}
  redis_data:
    external: true
    name: ${REDIS_VOLUME_NAME:-self-cloud-prj_redis_data}
