groups:
  - name: secure-cloud
    rules:
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 3m
        labels: {severity: warning}
        annotations: {summary: 'Monitoring target {{ $labels.job }} is unavailable'}
      - alert: HostFilesystemLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes < 0.1
        for: 10m
        labels: {severity: warning}
        annotations: {summary: 'Host filesystem has less than 10% free space'}
      - alert: BackendErrors
        expr: sum(rate(secure_cloud_http_requests_total{status_code=~"5.."}[5m])) / clamp_min(sum(rate(secure_cloud_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'More than 5% of API responses are server errors'}
      - alert: StorageMetricsStale
        expr: secure_cloud_storage_collection_success == 0 or time() - secure_cloud_storage_collection_timestamp_seconds > 180
        for: 3m
        labels: {severity: warning}
        annotations: {summary: 'Storage metrics collection is failing or stale'}
