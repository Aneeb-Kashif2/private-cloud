global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    installation: secure-cloud
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ['127.0.0.1:9090']}]
  - job_name: backend
    static_configs: [{targets: ['127.0.0.1:4001']}]
  - job_name: node
    static_configs: [{targets: ['127.0.0.1:9100']}]
  - job_name: cadvisor
    static_configs: [{targets: ['127.0.0.1:8083']}]
  - job_name: nginx
    static_configs: [{targets: ['127.0.0.1:9113']}]
  - job_name: postgres
    static_configs: [{targets: ['127.0.0.1:9187']}]
  - job_name: redis
    static_configs: [{targets: ['127.0.0.1:9121']}]
  - job_name: loki
    static_configs: [{targets: ['127.0.0.1:3100']}]
  - job_name: alloy
    static_configs: [{targets: ['127.0.0.1:12345']}]
  - job_name: grafana
    static_configs: [{targets: ['127.0.0.1:3002']}]
