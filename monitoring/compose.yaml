# Included by the root Compose file; paths resolve from the repository root.
x-monitor: &monitor
  network_mode: host
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: 5m, max-file: '2'}

services:
  postgres:
    image: postgres:17-alpine
    container_name: self-cloud-prj-postgres-1
    env_file: ${MONITORING_RUNTIME_DIR:-./monitoring/runtime}/postgres.env
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
    command: [postgres, -c, log_statement=none, -c, log_min_error_statement=panic, -c, log_error_verbosity=terse]
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 5m, max-file: '2'}}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    container_name: self-cloud-prj-redis-1
    ports: ['127.0.0.1:6379:6379']
    volumes: [redis_data:/data]
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 5m, max-file: '2'}}
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
  prometheus:
    <<: *monitor
    image: prom/prometheus:v3.14.0
    mem_limit: 256m
    cpus: 0.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=127.0.0.1:9090
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
      - --query.max-concurrency=4
      - --query.max-samples=1000000
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9090/-/ready']
      interval: 30s
      timeout: 5s
      retries: 5
  loki:
    <<: *monitor
    image: grafana/loki:3.7.7
    mem_limit: 256m
    cpus: 0.5
    command: [-config.file=/etc/loki/config.yml]
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
  grafana:
    <<: *monitor
    image: grafana/grafana:13.2.1
    mem_limit: 256m
    cpus: 0.5
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: '3002'
      GF_SERVER_ROOT_URL: '${GRAFANA_ROOT_URL:-http://localhost:8080/grafana/}'
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_SECURITY_COOKIE_SECURE: '${GRAFANA_COOKIE_SECURE:-false}'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_LOG_MODE: console
      GF_LOG_CONSOLE_FORMAT: json
      GF_LOG_LEVEL: warn
      GF_METRICS_ENABLED: 'true'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_UNIFIED_ALERTING_HA_LISTEN_ADDRESS: '127.0.0.1:9094'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - ${MONITORING_RUNTIME_DIR:-./monitoring/runtime}/grafana_admin_password:/run/secrets/grafana_admin_password:ro
    depends_on: [prometheus, loki]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:3002/grafana/api/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
  alloy:
    <<: *monitor
    image: grafana/alloy:v1.19.2
    mem_limit: 192m
    cpus: 0.5
    command: [run, --server.http.listen-addr=127.0.0.1:12345, --storage.path=/var/lib/alloy/data, --disable-reporting, /etc/alloy/config.alloy]
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
      - type: bind
        source: ${CLOUDFLARED_RUNTIME_DIR:-./.runtime}
        target: /var/log/secure-cloud-tunnel
        read_only: true
        bind:
          create_host_path: false
    depends_on: [loki]
  node-exporter:
    <<: *monitor
    image: prom/node-exporter:v1.12.1
    mem_limit: 48m
    cpus: 0.25
    pid: host
    command:
      - --web.listen-address=127.0.0.1:9100
      - --path.rootfs=/host
      - --collector.textfile.directory=/host/var/lib/secure-cloud-monitoring
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/.+)($$|/)
    volumes: ['/:/host:ro,rslave']
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9100/metrics']
      interval: 30s
      timeout: 5s
      retries: 5
  cadvisor:
    <<: *monitor
    image: ghcr.io/google/cadvisor:0.60.5
    mem_limit: 128m
    cpus: 0.5
    privileged: true
    command:
      - --listen_ip=127.0.0.1
      - --port=8083
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --disable_metrics=advtcp,cpu_topology,hugetlb,memory_numa,percpu,perf_event,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices: [/dev/kmsg:/dev/kmsg]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8083/healthz']
      interval: 30s
      timeout: 5s
      retries: 5
  nginx-exporter:
    <<: *monitor
    image: nginx/nginx-prometheus-exporter:1.5.3
    mem_limit: 32m
    cpus: 0.2
    command: [--web.listen-address=127.0.0.1:9113, --nginx.scrape-uri=http://127.0.0.1:8082/stub_status]
  postgres-exporter:
    <<: *monitor
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    mem_limit: 48m
    cpus: 0.25
    env_file: ${MONITORING_RUNTIME_DIR:-./monitoring/runtime}/postgres-exporter.env
    command: [--web.listen-address=127.0.0.1:9187, --no-collector.stat_statements, --no-collector.stat_activity_autovacuum]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9187/metrics']
      interval: 30s
      timeout: 5s
      retries: 5
  redis-exporter:
    <<: *monitor
    image: oliver006/redis_exporter:v1.91.1-alpine
    mem_limit: 32m
    cpus: 0.2
    command: [--web.listen-address=127.0.0.1:9121, --redis.addr=redis://127.0.0.1:6379]
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9121/metrics']
      interval: 30s
      timeout: 5s
      retries: 5
  cloudflared:
    <<: *monitor
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.9.0
    mem_limit: 128m
    cpus: 0.5
    command: [tunnel, --no-autoupdate, --logformat, json, --metrics, '127.0.0.1:20241', --url, 'http://127.0.0.1:8080']
    depends_on:
      nginx: {condition: service_healthy}

volumes:
  postgres_data:
    external: true
    name: self-cloud-prj_postgres_data
  redis_data:
    external: true
    name: self-cloud-prj_redis_data
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
