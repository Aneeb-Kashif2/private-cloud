name: secure-cloud

include:
  - path: ./monitoring/compose.yaml
    project_directory: .

x-logging: &logging
  driver: json-file
  options: {max-size: 5m, max-file: '2'}

# Linux host networking preserves existing localhost application connections.
services:
  migrate:
    image: ${BACKEND_IMAGE:-secure-cloud-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    logging: *logging
    network_mode: host
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file: ${APP_ENV_FILE:-./backend/.env}
    environment:
      NODE_ENV: production
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: ["../node_modules/.bin/prisma", "migrate", "deploy"]
    restart: "no"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  backend:
    image: ${BACKEND_IMAGE:-secure-cloud-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    logging: *logging
    network_mode: host
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file: ${APP_ENV_FILE:-./backend/.env}
    environment:
      NODE_ENV: production
      PORT: "4000"
      STORAGE_PATH: /srv/secure-cloud-storage
      STORAGE_LIMIT_BYTES: "5368709120"
    volumes:
      - type: bind
        source: /srv/secure-cloud-storage
        target: /srv/secure-cloud-storage
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 5m
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  frontend:
    image: ${FRONTEND_IMAGE:-secure-cloud-frontend:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    logging: *logging
    network_mode: host
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  nginx:
    image: nginx:stable-alpine
    logging: *logging
    network_mode: host
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
